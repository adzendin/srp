:root {
  --cream: #FAF6F0;
  --cream-2: #F3E9DB;
  --ink: #2B2118;
  --ink-soft: #6B5A4A;
  --wood: #8B5E3C;
  --wood-dark: #6E472A;
  --terra: #C67B5C;
  --terra-soft: #E8C9B5;
  --night: #2E2A33;
  --night-2: #3B3442;
  --line: #E6D9C6;
  --white: #FFFDF9;
  --footer: #1A1A1A;
}

@media (prefers-color-scheme: dark) {
  :root {
    --cream: #F7F0E6;
    --cream-2: #EFE2CF;
    --ink: #2B2118;
    --ink-soft: #6B5A4A;
    --white: #FFFDF9;
    --line: #E6D9C6;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--cream);
}

body {
  margin: 0;
  font-family: "Nunito Sans", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--cream);
}

a {
  color: inherit;
}

.shell {
  min-height: 100vh;
  background: var(--cream);
  padding-top: var(--safe-area-inset-top);
  overflow-x: clip;
}

.topbar {
  border-bottom: 1px solid var(--line);
  background: rgba(250,246,240,.92);
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 20;
}

.topbar__inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.back-link {
  font-weight: 800;
  font-size: 13px;
  text-decoration: none;
  color: var(--wood);
  white-space: nowrap;
  padding: 9px 0;
}

.back-link:hover {
  color: var(--terra);
  text-decoration: underline;
}

.topbar__brand {
  margin: 0;
  font-family: "Fraunces", Georgia, serif;
  font-weight: 700;
  font-size: 14px;
  text-align: right;
  overflow-wrap: anywhere;
}

.topbar__brand span {
  color: var(--terra);
}

main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 16px 8px;
}

.hero {
  padding: 30px 0 22px;
}

.eyebrow {
  margin: 0 0 8px;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--terra);
}

.hero h1 {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(42px, 11vw, 84px);
  line-height: .92;
  letter-spacing: -.03em;
  margin: 0;
  font-weight: 900;
}

.hero__hook {
  font-size: clamp(16px, 4.5vw, 20px);
  line-height: 1.6;
  color: #4A3A2D;
  max-width: 680px;
  margin: 18px 0 20px;
}

.hero__pills {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.pill {
  border-radius: 999px;
  padding: 10px 14px;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: .04em;
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
}

.pill small {
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
}

.pill--sun {
  background: #FFF0D9;
  border: 1px solid #E8C48B;
  color: #7A4A22;
}

.pill--night {
  background: var(--night);
  color: #F7EEDD;
}

.hero-strip {
  margin-top: 24px;
  display: grid;
  grid-template-columns: 1fr 1.15fr 1fr;
  gap: 8px;
  background: #F0E2CE;
  padding: 8px;
  border-radius: 24px;
  border: 1px solid #E2CFAF;
}

.hero-strip__item {
  margin: 0;
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  background-size: cover;
  background-position: center 28%;
  background-repeat: no-repeat;
  position: relative;
  min-width: 0;
  height: 210px;
}

.hero-strip__item--center {
  height: 230px;
}

.hero-strip__item figcaption {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(250,246,240,.94);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.hero__note {
  text-align: center;
  color: var(--ink-soft);
  font-size: 13px;
  margin: 12px 0 0;
}

.section-head {
  padding: 26px 0 14px;
}

.section-head h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(28px, 8vw, 44px);
  line-height: 1.05;
  margin: 0;
  letter-spacing: -.02em;
}

.featured-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  display: grid;
  box-shadow: 0 12px 30px rgba(43,33,24,.08);
}

.featured-card__visual {
  position: relative;
  min-height: 220px;
}

.featured-card__visual img {
  width: 100%;
  height: 100%;
  min-height: 220px;
  -o-object-fit: cover;
     object-fit: cover;
  -o-object-position: center 30%;
     object-position: center 30%;
  display: block;
}

.featured-card__badge {
  position: absolute;
  left: 14px;
  top: 14px;
  background: var(--ink);
  color: var(--cream);
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.featured-card__body {
  padding: 20px;
}

.featured-card__num {
  color: var(--terra);
  font-weight: 900;
  letter-spacing: .12em;
  font-size: 13px;
  margin: 0 0 8px;
}

.featured-card__body h3 {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(26px, 7vw, 36px);
  line-height: 1.1;
  margin: 0 0 10px;
}

.featured-card__body > p:last-of-type {
  line-height: 1.6;
  color: #504034;
  margin: 0 0 18px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--terra);
  color: #fff;
  text-decoration: none;
  font-weight: 800;
  border-radius: 999px;
  min-height: 48px;
  padding: 12px 18px;
}

.btn:hover {
  background: var(--wood-dark);
}

.btn--small {
  min-height: 44px;
  padding: 10px 16px;
  font-size: 14px;
  width: 100%;
}

.btn--large {
  min-height: 52px;
  padding: 13px 20px;
}

.btn--dark {
  background: var(--ink);
}

.group {
  padding: 22px 0 8px;
}

.group--spesial {
  margin-top: 14px;
}

.section-head--group {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: space-between;
  align-items: flex-end;
}

.group__mood {
  margin: 8px 0 0;
  color: var(--ink-soft);
  line-height: 1.5;
  max-width: 620px;
}

.group__count {
  background: #FFF0D9;
  border: 1px solid #E8C48B;
  color: #7A4A22;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}

.group__count--night {
  background: var(--night);
  color: #F7EEDD;
  border-color: var(--night);
}

.story-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.story-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.story-card--night {
  background: #2E2A33;
  border-color: #3E3846;
  color: #FAF6F0;
}

.story-card--night .btn {
  background: #F2D9BC;
  color: #2B2118;
}

.story-card--night .btn:hover {
  background: #fff;
}

.story-card__top {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.story-card__mark {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #FFF0D9;
  color: var(--terra);
}

.story-card--night .story-card__mark {
  background: #4A4256;
  color: #F2D9BC;
}

.story-card__title {
  margin: 4px 0 0;
  font-size: 15px;
  line-height: 1.35;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.characters {
  padding: 28px 0 10px;
}

.character-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 6px;
}

.character-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 14px;
}

.character-card h3 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 26px;
  margin: 14px 0 8px;
}

.character-card p {
  margin: 0;
  line-height: 1.65;
  color: #4A3A2D;
  overflow-wrap: anywhere;
}

.character-card__img {
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 4 / 3.4;
  background: #EFE2CF;
}

.character-card__img img {
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
  -o-object-position: center 28%;
     object-position: center 28%;
  display: block;
}

.character-card--kimo {
  background: #FFF0D9;
  border-color: #E8C48B;
}

.character-card__second {
  margin-top: 14px;
  border-radius: 14px;
  overflow: hidden;
  border: 4px solid #fff;
  box-shadow: 0 8px 20px rgba(43,33,24,.12);
}

.character-card__second img {
  width: 100%;
  height: 180px;
  -o-object-fit: cover;
     object-fit: cover;
  -o-object-position: center 30%;
     object-position: center 30%;
  display: block;
}

.closing {
  text-align: center;
  background: var(--wood);
  color: #FFF8EC;
  border-radius: 24px;
  padding: 28px 18px;
  margin: 28px 0 24px;
}

.closing__mark {
  font-family: "Fraunces", Georgia, serif;
  font-size: 28px;
  margin: 0 0 8px;
  color: #F2D9BC;
}

.closing h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(28px, 8vw, 40px);
  margin: 0 0 10px;
  line-height: 1.1;
}

.closing > p:not(.closing__mark) {
  margin: 0 auto 18px;
  line-height: 1.6;
  max-width: 520px;
}

.closing .btn {
  background: var(--cream);
  color: var(--ink);
}

.closing .btn:hover {
  background: #fff;
}

.footer {
  background: var(--footer);
  color: #FAF6F0;
  text-align: center;
  padding: 24px 16px calc(26px + var(--safe-area-inset-bottom, 0px));
}

.footer p {
  margin: 0;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.footer p + p {
  margin-top: 4px;
  color: #C9C0B5;
  font-size: 13px;
}

@media (min-width: 560px) {
  main {
    padding-left: 22px;
    padding-right: 22px;
  }

  .hero {
    padding-top: 38px;
  }

  .hero-strip__item {
    height: 280px;
  }

  .hero-strip__item--center {
    height: 305px;
  }

  .featured-card {
    grid-template-columns: 1.05fr 1fr;
  }

  .featured-card__visual {
    min-height: 100%;
  }

  .featured-card__visual img {
    position: absolute;
    inset: 0;
  }

  .featured-card__body {
    padding: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .story-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .character-grid {
    grid-template-columns: repeat(3, 1fr);
    align-items: stretch;
  }

  .character-card--kimo {
    grid-column: span 1;
  }
}

@media (min-width: 900px) {
  .story-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .hero {
    display: grid;
    grid-template-columns: 1fr 1.05fr;
    gap: 30px;
    align-items: center;
  }

  .hero-strip {
    margin-top: 0;
  }

  .hero__note {
    grid-column: 2;
    margin-top: -18px;
  }

  .character-card__img {
    aspect-ratio: 4 / 3.6;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
