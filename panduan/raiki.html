:root {
  --surface: #FAF6F0;
  --surface-2: #FFFDF9;
  --ink: #1A1A1A;
  --muted: #5E5A54;
  --line: #E3D8CB;
  --accent: #C67B5C;
  --accent-dark: #A85F42;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #171614;
    --surface-2: #221F1C;
    --ink: #F6F0E8;
    --muted: #C7BDB3;
    --line: #453F39;
    --accent: #D78A68;
    --accent-dark: #E79A78;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
}

h1, h2, h3, .serif {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 600;
  letter-spacing: -0.02em;
}

a {
  color: inherit;
}

img {
  max-width: 100%;
}

.figure {
  border: 1px solid var(--line);
  background: #fff;
  padding: 10px;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(26,26,26,.07);
}

.figure img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--accent-dark);
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-dark);
}

.btn-ghost {
  border: 1px solid var(--ink);
}

.topbar {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 20;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.navlink {
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 8px 11px;
  white-space: nowrap;
}

.navlink:hover, .navlink:focus-visible {
  border-color: var(--line);
  background: var(--surface-2);
}

.anchor-card {
  border-top: 1px solid var(--line);
}

.spec dt {
  color: var(--muted);
  font-size: 13px;
}

.spec dd {
  margin: 2px 0 0;
  font-weight: 650;
}

.table-wrap {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 560px;
}

th, td {
  border-bottom: 1px solid var(--line);
  padding: 11px 10px;
  text-align: left;
  vertical-align: top;
}

th {
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}

@media (max-width: 640px) {
  table {
    min-width: 520px;
  }
}

.last\:border-0:last-child {
  border-width: 0px;
}

.hover\:border-\[var\(--accent\)\]:hover {
  border-color: var(--accent);
}

@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:gap-x-5 {
    -moz-column-gap: 1.25rem;
         column-gap: 1.25rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-16 {
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }
}

@media (min-width: 1024px) {
  .lg\:flex {
    display: flex;
  }

  .lg\:hidden {
    display: none;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[\.9fr_1\.1fr\] {
    grid-template-columns: .9fr 1.1fr;
  }

  .lg\:grid-cols-\[1\.2fr_\.8fr\] {
    grid-template-columns: 1.2fr .8fr;
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\] {
    grid-template-columns: 1.35fr .65fr;
  }

  .lg\:grid-cols-\[1fr_1\.05fr\] {
    grid-template-columns: 1fr 1.05fr;
  }

  .lg\:text-7xl {
    font-size: 4.5rem;
    line-height: 1;
  }
}
