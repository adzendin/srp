:root {

  --surface-2: #FFFFFF;
  --surface-3: #F1E9E0;
  --text: #1A1A1A;
  --muted: #68625A;

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #171614;
    --surface-2: #211F1D;
    --surface-3: #2B2825;

    --muted: #B9B0A5;
    --line: #3A362F;
    --accent: #D08A68;
    --accent-ink: #1A1A1A;

* {
  box-sizing: border-box;
}

html {
  background: var(--surface);
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--text);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.serif {
  font-family: Georgia, "Times New Roman", serif;
}

::-moz-selection {
  background: #EAD9CB;
  color: #1A1A1A;
}

::selection {
  background: #EAD9CB;
  color: #1A1A1A;
}

.hover\:bg-\[var\(--accent\)\]:hover {

}

.hover\:bg-\[var\(--surface-3\)\]:hover {
  background-color: var(--surface-3);
}

.hover\:text-\[var\(--accent\)\]:hover {
  color: var(--accent);
}

.hover\:text-\[var\(--accent-ink\)\]:hover {
  color: var(--accent-ink);

.focus\:bg-\[var\(--surface-2\)\]:focus {

.focus\:py-2:focus {

@media (min-width: 768px) {
