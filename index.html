  text-decoration-line: underline;
}

.underline-offset-4 {
  text-underline-offset: 4px;
}

.shadow-sm {
  --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);

}

.outline-none {

:root{
  --surface:#FAF6F0;
  --surface-2:#F1E7DB;
  --surface-3:#E8D9C8;
  --ink:#2B2118;
  --charcoal:#1A1A1A;
  --wood:#8B5E3C;
  --terra:#C67B5C;
  --muted:#6F6153;
  --line:#D9C8B4;
  --card:#FFFDF9;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#1E1711;
    --surface-2:#2A2018;
    --surface-3:#392C20;
    --ink:#FAF6F0;
    --charcoal:#FAF6F0;
    --wood:#D3A37E;
    --terra:#D68B68;
    --muted:#C8B9AA;
    --line:#4A3A2C;
    --card:#271E16;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif
}

h1,h2,h3,.serif{
  font-family:"Fraunces",Georgia,serif
}

a{
  color:inherit
}

.hover\:text-\[var\(--terra\)\]:hover {
  color: var(--terra);
}

.focus\:border-\[var\(--wood\)\]:focus {
  border-color: var(--wood);
}

@media (min-width: 640px) {
  .sm\:w-auto {
    width: auto;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-16 {
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:pb-16 {
    padding-bottom: 4rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  }

  }
